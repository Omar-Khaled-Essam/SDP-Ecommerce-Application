plugins {
    id 'application'
}

group = 'com.example'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    // implementation 'org.mindrot:jbcrypt:0.4' // uncomment if we add password hashing
}

application {
    mainClass = 'Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['ecommerce']
        }
        resources {
            srcDirs = []
        }
    }
}

// JavaFX modules are not declared here; relying on local JavaFX SDK already set up in your IDE/run config.